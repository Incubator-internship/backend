apiVersion: apps/v1
kind: Deployment
metadata:
  name: DEPLOYMENT_NAME
  namespace: NAMESPACE
  labels:
    app: PROJECT
spec:
  selector:
    matchLabels:
      project: PROJECT
  template:
    metadata:
      namespace: NAMESPACE
      labels:
        project: PROJECT
    spec:
      containers:
         - name: PROJECT
           image: REGISTRY_HOSTNAME/PROJECT:TAG_VERSION
           ports:
             - containerPort: PORT_CONTAINER

           env:
             - name: EMAIL_PASS
               valueFrom:
                 secretKeyRef:
                   name: auth-backend-production-config-secret
                   key: EMAIL_PASS
             - name: GOOGLE_CLIENT_ID
               valueFrom:
                 secretKeyRef:
                   name: auth-backend-production-config-secret
                   key: GOOGLE_CLIENT_ID
             - name: GOOGLE_CLIENT_SECRET
               valueFrom:
                 secretKeyRef:
                   name: auth-backend-production-config-secret
                   key: GOOGLE_CLIENT_SECRET
             - name: GOOGLE_CALLBACK_LOCAL_URL
               valueFrom:
                 secretKeyRef:
                   name: auth-backend-production-config-secret
                   key: GOOGLE_CALLBACK_LOCAL_URL
             - name: GOOGLE_CALLBACK_PROD_URL
               valueFrom:
                 secretKeyRef:
                   name: auth-backend-production-config-secret
                   key: GOOGLE_CALLBACK_PROD_URL
             - name: DATABASE_URL
               valueFrom:
                 secretKeyRef:
                   name: auth-backend-production-config-secret
                   key: DATABASE_URL
             - name: RECAPTCHA_SECRET_KEY
               valueFrom:
                 secretKeyRef:
                   name: auth-backend-production-config-secret
                   key: RECAPTCHA_SECRET_KEY
             - name: RECAPTCHA_URL
               valueFrom:
                 secretKeyRef:
                   name: auth-backend-production-config-secret
                   key: RECAPTCHA_URL
             - name: JWT_SECRET
               valueFrom:
                 secretKeyRef:
                   name: auth-backend-production-config-secret
                   key: JWT_SECRET
