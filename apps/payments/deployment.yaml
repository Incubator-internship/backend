apiVersion: apps/v1
kind: Deployment
metadata:
  name: DEPLOYMENT_NAME
  namespace: NAMESPACE
  labels:
    app: PROJECT
spec:
  selector:
    matchLabels:
      project: PROJECT
  template:
    metadata:
      namespace: NAMESPACE
      labels:
        project: PROJECT
    spec:
      containers:
         - name: PROJECT
           image: REGISTRY_HOSTNAME/PROJECT:TAG_VERSION
           ports:
             - containerPort: PORT_CONTAINER

           env:
             - name: RABBIT_URL
               valueFrom:
                 secretKeyRef:
                   name: payments-backend-production-config-secret
                   key: RABBIT_URL
             - name: CLIENT_PAYPAL_ID
               valueFrom:
                 secretKeyRef:
                   name: payments-backend-production-config-secret
                   key: CLIENT_PAYPAL_ID
             - name: CLIENT_PAYPAL_SECRET
               valueFrom:
                 secretKeyRef:
                   name: payments-backend-production-config-secret
                   key: CLIENT_PAYPAL_SECRET
             - name: PAYMENTS_DATABASE_URL
               valueFrom:
                 secretKeyRef:
                   name: payments-backend-production-config-secret
                   key: PAYMENTS_DATABASE_URL
